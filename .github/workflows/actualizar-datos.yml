name: actualizar-datos
# Pipeline mensual: BCRA/INDEC â†’ JSON â†’ sanity + tests + build â†’ push a main â†’ deploy de Pages.
on:
  schedule:
    - cron: "0 10 1 * *" # 1Âº de cada mes 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch de datos oficiales (BCRA + Argly/INDEC)
        run: node scripts/fetch-datos.mjs

      - name: Sanity de los datos (rango + frescura)
        run: node scripts/sanity-datos.mjs

      - name: Validar con tests antes de publicar
        run: |
          npm ci
          npm test
          npm run build

      - name: Detectar cambios
        id: diff
        run: |
          if git diff --quiet src/data; then
            echo "cambios=false" >> "$GITHUB_OUTPUT"
          else
            echo "cambios=true" >> "$GITHUB_OUTPUT"
            MES=$(date -u +"%Y-%m")
            echo "mes=$MES" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit y push a main
        if: steps.diff.outputs.cambios == 'true'
        run: |
          git config user.name "hermes-bot"
          git config user.email "bot@reditos.ar"
          git add src/data
          git commit -m "datos: actualizaciÃ³n automÃ¡tica ${{ steps.diff.outputs.mes }}"
          # Push directo: los datos ya pasaron sanity + tests + build arriba. Un PR
          # creado con GITHUB_TOKEN queda esperando aprobaciÃ³n manual y el run
          # vence en rojo todos los meses (el CI nunca corre).
          git push origin HEAD:main
